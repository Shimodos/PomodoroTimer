name: Release (macOS)

# Same v* tags as release.yml (Windows). Builds the macOS app from macos/ and attaches
#   Pomodoro-<ver>-macos.zip   the .app, ad-hoc signed (right-click → Open on first launch)
#   Pomodoro-<ver>-macos.dmg   drag-to-Applications installer
# to the GitHub release. The Windows workflow usually creates the release; this job waits
# for it and creates it itself only if it never shows up. Can also be run by hand for an
# existing tag (Actions → Release (macOS) → Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v1.0.3)"
        required: true

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version from tag
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Test
        working-directory: macos
        run: make test

      - name: Build app, zip and dmg
        working-directory: macos
        run: |
          make app VERSION="${{ steps.ver.outputs.version }}"
          make zip
          make dmg

      - name: Wait for the release created by the Windows job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && exit 0
            sleep 20
          done
          v="${{ steps.ver.outputs.version }}"
          gh release create "$TAG" --title "Pomodoro $v" --notes "Pomodoro $v" || true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release upload "$TAG" \
            "macos/build/Pomodoro-$v-macos.zip" \
            "macos/build/Pomodoro-$v-macos.dmg" \
            --clobber
